[package]
name = "rust_win_trackpad"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["zforddev"]
description = "A small, temporary Windows precision-touchpad workaround."
license = "Apache-2.0"
readme = "README.md"
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", default-features = false, features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_DirectManipulation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The COM implementation macro refers to this crate directly.
windows-core = { version = "0.58", default-features = false }
